# ====================================================================
# SYSPCC en DigitalOcean App Platform (SYSPCC-024, opcion "Optimizada": SYSPCC-033)
# Guia paso a paso: docs/08_Guia_Despliegue_DigitalOcean.md
# ====================================================================
#
# ESTE ARCHIVO ES UNA PLANTILLA SIN SECRETOS. No lo apliques tal cual:
#   1. Completa .env.do (gitignored) con los secretos.
#   2. Renderiza:  backend/.venv/bin/python .do/render_spec.py
#      -> genera .do/app.rendered.yaml (gitignored) con los secretos
#      inyectados; los opcionales sin valor se eliminan del spec.
#   3. Crea:       doctl apps create --spec .do/app.rendered.yaml --wait
#
# DESPUES del primer create, parte SIEMPRE de `doctl apps spec get <APP_ID>`
# para cambiar el spec (trae los secretos cifrados EV[...]). Aplicar esta
# plantilla otra vez BORRARIA los secretos ya cargados.
#
# Prerrequisitos (App Platform solo ADJUNTA clusters; ver la guia, pasos 5-6):
#   * Cluster Managed PostgreSQL `syspcc-pg` con un connection pool
#     `syspccpool` (modo transaction) sobre la base `syspcc`.
#   * Cluster Managed Valkey `syspcc-valkey`.
#   * Ambos con trusted sources restringidos a la app.
#
# Costo mensual (US$, region nyc, precios verificados el 29-oct-2026):
#   backend     apps-s-2vcpu-4gb   50.00   gunicorn 4 x 4 + LibreOffice
#   worker      apps-s-1vcpu-1gb   12.00   colas celery + hr_cv, beat embebido (1 instancia)
#   Managed PG 1 GiB               15.15
#   Managed Valkey 1 GiB           15.00
#   Spaces                          5.00
#   frontend (static site)          0.00   + job PRE_DEPLOY: centavos
#   TOTAL                          97.15   (US$1,165.80 al anio)
# MEJORA OPCIONAL (+12.00 = 109.15): un `worker-hr` aparte para la cola hr_cv si los
# lotes de CVs retrasan los recordatorios/SLA (ver la guia, seccion 1.3 y "Variantes").
name: syspcc
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# --------------------------------------------------------------------
# Variables a nivel app (llegan a backend, workers y job; el static site
# solo usa las BUILD_TIME de su propio bloque).
# Las que tienen value "" son SECRET (o datos de empresa) que
# render_spec.py completa desde .env.do.
# --------------------------------------------------------------------
envs:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
    scope: RUN_TIME
  # Segunda senal de produccion: seed_guard bloquea seed_demo.
  - key: DJANGO_ENV
    value: production
    scope: RUN_TIME
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
    value: ""
  # Dominio *.ondigitalocean.app asignado. Con un dominio propio agrega el
  # nuevo host aqui (separado por comas) y en CSRF_TRUSTED_ORIGINS.
  - key: ALLOWED_HOSTS
    value: ${APP_DOMAIN}
    scope: RUN_TIME
  - key: CSRF_TRUSTED_ORIGINS
    value: ${APP_URL}
    scope: RUN_TIME
  - key: CORS_ALLOWED_ORIGINS
    value: ${APP_URL}
    scope: RUN_TIME
  # SECURE_SSL_REDIRECT queda en su default (True): production.py confia en
  # X-Forwarded-Proto y /healthz/ esta exento del redireccionamiento.

  # --- IP real del cliente (throttling) ---
  # El ingress de DO escribe SU IP en X-Forwarded-For; la del cliente llega en
  # el header do-connecting-ip. TRUST_DO_CONNECTING_IP la usa como REMOTE_ADDR
  # y fija NUM_PROXIES=0. NO definas NUM_PROXIES en este spec.
  - key: TRUST_DO_CONNECTING_IP
    value: "True"
    scope: RUN_TIME

  # --- PostgreSQL: TLS verificado + conexiones persistentes ---
  # verify-ca valida el certificado del servidor con el CA del cluster
  # (DB_CA_CERT=${db.CA_CERT}, declarado en cada componente que usa la BD).
  # Si el CA no es un PEM valido el contenedor aborta el arranque.
  - key: DB_SSLMODE
    value: verify-ca
    scope: RUN_TIME
  # Conexiones persistentes (60 s). Cada hilo de gunicorn y cada proceso de
  # celery mantiene UNA conexion al pool de PgBouncer (no al servidor).
  - key: DB_CONN_MAX_AGE
    value: "60"
    scope: RUN_TIME
  # backend y workers hablan con el pool de PgBouncer en modo TRANSACTION
  # (ver `databases:` y los bindables ${db.syspccpool.*}): sin cursores del
  # lado del servidor. El job `migrate` va directo al cluster; la bandera es
  # inocua alli.
  - key: DB_DISABLE_SERVER_SIDE_CURSORS
    value: "True"
    scope: RUN_TIME

  # --- Managed Valkey (cluster `syspcc-valkey`, base `cache` en `databases:`) ---
  # TLS (rediss://) con el certificado VERIFICADO contra el CA del cluster:
  # REDIS_CA_CERT=${cache.CA_CERT} se declara en backend y workers. NUNCA pongas
  # REDIS_SSL_CERT_REQS=none (no autentica al servidor).
  - key: REDIS_SSL_CERT_REQS
    value: required
    scope: RUN_TIME
  # Valkey es persistente y autenticado: la cache, las sesiones del panel y los
  # contadores de throttling viven ahi (compartidos y EXACTOS entre los 4
  # workers de gunicorn). Si Valkey cae, la API responde 5xx hasta que vuelva
  # (falla cerrada: el limite de login 5/min nunca se degrada en silencio).
  # Con "True" la cache degrada en vez de fallar y production.py mueve los
  # throttles a una cache local por proceso (THROTTLE_CACHE_ALIAS=throttle):
  # el limite pasaria a ser por worker de gunicorn (4x), por eso queda en False.
  - key: DJANGO_REDIS_IGNORE_EXCEPTIONS
    value: "False"
    scope: RUN_TIME

  # --- Spaces (django-storages / S3) ---
  # Dos buckets PRIVADOS en nyc3: media general y RR. HH. (PII).
  - key: AWS_STORAGE_BUCKET_NAME
    value: syspcc-media
    scope: RUN_TIME
  - key: AWS_S3_ENDPOINT_URL
    value: https://nyc3.digitaloceanspaces.com
    scope: RUN_TIME
  - key: AWS_S3_REGION_NAME
    value: nyc3
    scope: RUN_TIME
  - key: HR_FILE_STORAGE
    value: apps.hr.storage.PrivateS3Storage
    scope: RUN_TIME
  - key: HR_PRIVATE_BUCKET_NAME
    value: syspcc-hr-private
    scope: RUN_TIME

  # --- Secretos de integraciones: NO van aqui ---
  # AWS_*, HR_AWS_*, ANTHROPIC_API_KEY, ONEDRIVE_TOKEN_ENCRYPTION_KEY,
  # RUC_API_TOKEN y EMAIL_HOST_PASSWORD se declaran SOLO en los componentes
  # que los usan (backend / worker). Asi el job PRE_DEPLOY
  # `migrate` recibe unicamente SECRET_KEY y DB_* (minimo privilegio).

  # --- Analisis de CVs de RR. HH. (SYSPCC-023) ---
  # El proveedor SIMULADO ('fake') esta prohibido en produccion: production.py
  # aborta el arranque si se define. Se fija explicito para que quede a la vista.
  - key: HR_CV_PROVIDER
    value: anthropic
    scope: RUN_TIME
  # Los CVs se analizan en la cola hr_cv del `worker`, no en hilos del backend.
  - key: HR_CV_DISPATCH
    value: celery
    scope: RUN_TIME
  # Los demas HR_CV_* / HR_ASSISTANT_* (modelo, esfuerzo, limites diarios,
  # retencion HR_CV_RETENTION_DAYS) usan los defaults de settings/base.py; para
  # ajustarlos agregalos aqui o en el spec vivo (lista en la guia, seccion 21).
  #
  # MEMORIA del worker unico (1 GiB, 2 procesos que pueden analizar un CV a la vez):
  # decodificar una imagen cuesta ~114 MB (JPEG 16 Mpx) a ~420 MB (PNG con alfa 40 Mpx)
  # POR PROCESO, sobre ~160 MB base cada uno. El default HR_CV_MAX_IMAGE_PIXELS es
  # 40 millones: dos imagenes asi a la vez superan 1 GiB (OOM, y con el se reinicia
  # tambien beat). Por eso se fija en 16 millones (cubre fotos de 16 MP y escaneos):
  - key: HR_CV_MAX_IMAGE_PIXELS
    value: "16000000"
    scope: RUN_TIME
  # Un lote de 100 CVs tarda ~27 min en el worker unico (prueba de carga): con el
  # default de 600 s el beat re-encolaria items que solo esperan su turno. 3600 s
  # deja margen al lote y aun recupera items perdidos (worker caido) en una hora.
  - key: HR_CV_STALE_SECONDS
    value: "3600"
    scope: RUN_TIME

  # --- Correo (DO bloquea el puerto 25; 587 funciona) ---
  # EMAIL_HOST_PASSWORD va en backend y worker. Sin el, production.py envia los correos a la consola
  # (logs) en vez de fallar cada dia con un error de autenticacion SMTP.
  - key: EMAIL_HOST
    value: smtp.office365.com
    scope: RUN_TIME
  - key: EMAIL_PORT
    value: "587"
    scope: RUN_TIME
  - key: EMAIL_HOST_USER
    value: sistemas@pcc.com.pe
    scope: RUN_TIME
  - key: DEFAULT_FROM_EMAIL
    value: sistemas@pcc.com.pe
    scope: RUN_TIME
  - key: WAREHOUSE_ALERT_RECIPIENTS
    value: sistemas@pcc.com.pe
    scope: RUN_TIME

  # --- OneDrive (PDF de despachos del almacen; OPCIONAL) ---
  # Sin ONEDRIVE_CLIENT_ID la integracion responde "OneDrive no configurado"
  # (no rompe nada). Se completan desde .env.do; si faltan se omiten del spec
  # y rigen los defaults (tenant `consumers`, alcance `organization`).
  - key: ONEDRIVE_CLIENT_ID
    value: ""
    scope: RUN_TIME
  - key: ONEDRIVE_TENANT
    value: ""
    scope: RUN_TIME
  - key: ONEDRIVE_SHARE_SCOPE
    value: ""
    scope: RUN_TIME

  # --- RR. HH.: datos de la empresa impresos en los contratos ---
  # Se completan desde .env.do (no son secretos, pero tampoco se versionan).
  - key: HR_COMPANY_NAME
    value: ""
    scope: RUN_TIME
  - key: HR_COMPANY_RUC
    value: ""
    scope: RUN_TIME
  - key: HR_COMPANY_ADDRESS
    value: ""
    scope: RUN_TIME
  - key: HR_COMPANY_LEGAL_REP_NAME
    value: ""
    scope: RUN_TIME
  - key: HR_COMPANY_LEGAL_REP_DNI
    value: ""
    scope: RUN_TIME
  - key: HR_COMPANY_LEGAL_REP_TITLE
    value: ""
    scope: RUN_TIME
  - key: HR_COMPANY_LEGAL_REP_POWERS
    value: ""
    scope: RUN_TIME
  - key: HR_MIN_WAGE
    value: ""
    scope: RUN_TIME

# --------------------------------------------------------------------
# Bases de datos: clusters gestionados creados ANTES (ver la guia, pasos 5-6).
# NO se usa Dev Database: en PG 15+ no concede CREATE sobre el schema public
# y el migrate del PRE_DEPLOY falla con "permission denied for schema public".
#
# Presupuesto de conexiones del cluster PG de 1 GiB (~22 utilizables):
#   * backend y worker entran por el POOL (PgBouncer, modo transaction,
#     size 15): ~19 conexiones de cliente (16 hilos de gunicorn + 2 procesos de
#     celery + beat) comparten 15 conexiones reales.
#   * el job `migrate` y las consolas entran directo (quedan ~7 libres).
# El spec NO declara el pool (la referencia del app spec no tiene ese campo):
# se crea con `doctl databases pool create` y se referencia por sus bindables
# ${db.syspccpool.HOSTNAME|PORT|DATABASE|USERNAME|PASSWORD} (guia, paso 5).
# --------------------------------------------------------------------
databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: syspcc-pg
    db_name: syspcc
    db_user: syspcc
    # SEGURIDAD: tras crear el cluster restringe sus trusted sources a esta app
    # (guia, paso 5): un cluster nuevo acepta conexiones desde cualquier IP.

  # Valkey gestionado (reemplaza al Redis interno efimero y sin contrasena).
  # Bindables usados: HOSTNAME, PORT, PASSWORD y CA_CERT. El usuario de Valkey
  # es siempre `default`. Restringe sus trusted sources a la app (guia, paso 6)
  # y confirma que la politica de evicion es `noeviction` (la cola de Celery
  # no puede perder mensajes).
  - name: cache
    engine: VALKEY
    production: true
    cluster_name: syspcc-valkey

# --------------------------------------------------------------------
# Servicios HTTP
# --------------------------------------------------------------------
services:
  - name: backend
    github:
      repo: pccpegit/SYSPCCLOG
      branch: develop
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    # collectstatic + gunicorn (sin migrate: lo hace el job PRE_DEPLOY).
    run_command: sh scripts/do-start.sh
    http_port: 8080
    # 2 vCPU compartidas / 4 GiB. gunicorn gthread 4 workers x 4 hilos = 16
    # peticiones en paralelo (~200 MB por worker + picos de LibreOffice al
    # convertir contratos y de openpyxl al importar el libro del almacen).
    instance_size_slug: apps-s-2vcpu-4gb
    instance_count: 1
    health_check:
      # HealthCheckMiddleware responde antes de ALLOWED_HOSTS y del redirect SSL.
      http_path: /healthz/
      initial_delay_seconds: 60
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    termination:
      drain_seconds: 15
      grace_period_seconds: 60
    envs:
      # LibreOffice: conversion de contratos .docx a PDF (+400-500 MB de imagen).
      - key: INSTALL_LIBREOFFICE
        value: "true"
        scope: BUILD_TIME
      # Leidas por scripts/do-start.sh.
      - key: GUNICORN_WORKERS
        value: "4"
        scope: RUN_TIME
      - key: GUNICORN_THREADS
        value: "4"
        scope: RUN_TIME
      # Segundos por peticion: importacion del libro del almacen y conversion
      # LibreOffice corren dentro de la peticion.
      - key: GUNICORN_TIMEOUT
        value: "120"
        scope: RUN_TIME
      # --- Secretos de este componente (opcionales se omiten si estan vacios) ---
      # Spaces: media general. Usa una Access Key limitada al bucket syspcc-media.
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      # Spaces: bucket RR. HH. (PII). OPCIONAL pero recomendado: una segunda Access
      # Key limitada a syspcc-hr-private; sin ella se usa el par AWS_* de arriba.
      - key: HR_AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: HR_AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      # Asistente de RR. HH. y lectura de convocatorias (sincronos en la peticion).
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: ONEDRIVE_TOKEN_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: RUC_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ""
      # Los bindables ${db.*} / ${cache.*} van a nivel de componente (patron
      # documentado). BD: POOL de PgBouncer (modo transaction).
      - key: DB_NAME
        value: ${db.syspccpool.DATABASE}
        scope: RUN_TIME
      - key: DB_USER
        value: ${db.syspccpool.USERNAME}
        scope: RUN_TIME
      - key: DB_PASSWORD
        value: ${db.syspccpool.PASSWORD}
        scope: RUN_TIME
      - key: DB_HOST
        value: ${db.syspccpool.HOSTNAME}
        scope: RUN_TIME
      - key: DB_PORT
        value: ${db.syspccpool.PORT}
        scope: RUN_TIME
      - key: DB_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      # Valkey (rediss:// + CA verificado). /0 cache y sesiones, /1 broker, /2 resultados.
      - key: REDIS_URL
        value: rediss://default:${cache.PASSWORD}@${cache.HOSTNAME}:${cache.PORT}/0
        scope: RUN_TIME
      - key: CELERY_BROKER_URL
        value: rediss://default:${cache.PASSWORD}@${cache.HOSTNAME}:${cache.PORT}/1
        scope: RUN_TIME
      - key: CELERY_RESULT_BACKEND
        value: rediss://default:${cache.PASSWORD}@${cache.HOSTNAME}:${cache.PORT}/2
        scope: RUN_TIME
      - key: REDIS_CA_CERT
        value: ${cache.CA_CERT}
        scope: RUN_TIME

# --------------------------------------------------------------------
# Worker de Celery: UN contenedor para todo.
#   * colas `celery` (SLA, recordatorios, cache, alertas de stock, PDF de
#     despachos, purga de importaciones del almacen) y `hr_cv` (analisis de CVs
#     de RR. HH. y su recuperacion).
#   * BEAT embebido (-B): este es el UNICO componente que lo ejecuta.
#
# NO ESCALAR a mas de 1 instancia (ni con autoscaling): beat quedaria duplicado
# y los recordatorios / alertas saldrian repetidos. `apps-s-1vcpu-1gb` (sin
# -fixed) permite escalar a mano: no lo hagas. Mas capacidad = subir el tamano,
# o separar la cola hr_cv en un `worker-hr` (mejora opcional de +US$12, guia).
#
# Opciones (existen en Celery 5.4, la version de requirements.txt):
#   -c 2                      dos procesos.
#   -O fair                   un proceso recibe tarea nueva solo cuando se libera.
#   --prefetch-multiplier 1   no acaparar tareas por adelantado: un CV de 2 minutos no
#                             retiene tareas cortas detras. (El codigo no define
#                             CELERY_WORKER_PREFETCH_MULTIPLIER, por eso va en la linea.)
#   --max-tasks-per-child 100 recicla el proceso (Pillow/PDF fragmentan memoria).
# Limite conocido: dos CVs a la vez ocupan los dos procesos hasta ~2 minutos y
# retrasan SLA/recordatorios en ese lapso. Si molesta, usa la mejora opcional.
# --------------------------------------------------------------------
workers:
  - name: worker
    github:
      repo: pccpegit/SYSPCCLOG
      branch: develop
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    run_command: celery -A config worker -B -Q celery,hr_cv -c 2 -O fair --prefetch-multiplier 1 --max-tasks-per-child 100 --scheduler django_celery_beat.schedulers:DatabaseScheduler -l info
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    termination:
      # time_limit de la tarea de CV = 180 s: un apagado tibio deja terminar el CV en
      # curso (si no alcanza, acks_late lo reentrega).
      grace_period_seconds: 190
    envs:
      - key: INSTALL_LIBREOFFICE
        value: "false"
        scope: BUILD_TIME
      # --- Secretos de este componente (opcionales se omiten si estan vacios) ---
      # Spaces: media general (PDF de despachos, libros del almacen) ...
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      # ... y bucket de RR. HH. (los CVs se leen aqui) + API de analisis de CVs.
      - key: HR_AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: HR_AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: ONEDRIVE_TOKEN_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: DB_NAME
        value: ${db.syspccpool.DATABASE}
        scope: RUN_TIME
      - key: DB_USER
        value: ${db.syspccpool.USERNAME}
        scope: RUN_TIME
      - key: DB_PASSWORD
        value: ${db.syspccpool.PASSWORD}
        scope: RUN_TIME
      - key: DB_HOST
        value: ${db.syspccpool.HOSTNAME}
        scope: RUN_TIME
      - key: DB_PORT
        value: ${db.syspccpool.PORT}
        scope: RUN_TIME
      - key: DB_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: REDIS_URL
        value: rediss://default:${cache.PASSWORD}@${cache.HOSTNAME}:${cache.PORT}/0
        scope: RUN_TIME
      - key: CELERY_BROKER_URL
        value: rediss://default:${cache.PASSWORD}@${cache.HOSTNAME}:${cache.PORT}/1
        scope: RUN_TIME
      - key: CELERY_RESULT_BACKEND
        value: rediss://default:${cache.PASSWORD}@${cache.HOSTNAME}:${cache.PORT}/2
        scope: RUN_TIME
      - key: REDIS_CA_CERT
        value: ${cache.CA_CERT}
        scope: RUN_TIME

# --------------------------------------------------------------------
# Jobs: antes de cada deploy migra el esquema y carga los datos de
# referencia (seed_data es idempotente y no crea usuarios). Nunca seed_demo.
# Conexion DIRECTA al cluster (no al pool): las migraciones usan DDL y bloqueos
# que PgBouncer en modo transaction no garantiza.
# --------------------------------------------------------------------
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: pccpegit/SYSPCCLOG
      branch: develop
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    run_command: sh scripts/do-predeploy.sh
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: INSTALL_LIBREOFFICE
        value: "false"
        scope: BUILD_TIME
      - key: DB_NAME
        value: ${db.DATABASE}
        scope: RUN_TIME
      - key: DB_USER
        value: ${db.USERNAME}
        scope: RUN_TIME
      - key: DB_PASSWORD
        value: ${db.PASSWORD}
        scope: RUN_TIME
      - key: DB_HOST
        value: ${db.HOSTNAME}
        scope: RUN_TIME
      - key: DB_PORT
        value: ${db.PORT}
        scope: RUN_TIME
      - key: DB_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME

# --------------------------------------------------------------------
# Frontend: SPA React 19 + Vite 7. Node fijado por "engines" (22.x) en
# frontend/package.json; el buildpack ya corre `npm ci`, por eso el
# build_command es solo `npm run build`.
# --------------------------------------------------------------------
static_sites:
  - name: frontend
    github:
      repo: pccpegit/SYSPCCLOG
      branch: develop
      deploy_on_push: true
    source_dir: frontend
    environment_slug: node-js
    build_command: npm run build
    output_dir: dist
    # Deep links de React Router v7 (/rq/*, /almacen/*, /admin/*).
    catchall_document: index.html
    envs:
      # Misma origin para SPA y API (cookies JWT SameSite=Lax + CSRF).
      - key: VITE_API_URL
        value: /api/v1/
        scope: BUILD_TIME
      # Vacio a proposito: SPA y API comparten origin (URLs relativas), igual que
      # la demo en Vercel. render_spec.py lo conserva como "" (KEEP_EMPTY).
      - key: VITE_BACKEND_URL
        value: ""
        scope: BUILD_TIME

# --------------------------------------------------------------------
# Ingress: App Platform recorta el prefijo por defecto; Django necesita
# el path completo, de ahi preserve_path_prefix en cada regla al backend.
# Las reglas especificas van antes del catch-all "/".
# Todo lo agregado en SYSPCC-025..032 (almacen, Master de RQ, borradores,
# entregas parciales, importacion) cuelga de /api/v1/: no hay rutas nuevas.
# /healthz NO se publica: el health_check de la plataforma llega directo al
# componente (no pasa por el ingress) y exponerlo permitiria a cualquiera
# consumir conexiones de BD. /media tampoco: con Spaces las URLs firmadas son
# absolutas y production.py no sirve /media.
# --------------------------------------------------------------------
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /mgmt-panel
      component:
